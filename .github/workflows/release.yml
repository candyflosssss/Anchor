name: Anchor prerelease

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*-alpha.*'
      - 'v*-beta.*'
      - 'v*-rc.*'

permissions:
  contents: read

concurrency:
  group: anchor-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: '1'
  GOMAXPROCS: '2'
  GOFLAGS: '-p=1'

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      version: ${{ steps.plan.outputs.version }}
      draft: ${{ steps.plan.outputs.draft }}
      targets: ${{ steps.plan.outputs.targets }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Validate trigger and choose version
        id: plan
        run: |
          python3 scripts/ci_release.py plan \
            --event "$GITHUB_EVENT_NAME" --ref "$GITHUB_REF" \
            --run-number "$GITHUB_RUN_NUMBER" --output "$GITHUB_OUTPUT"
      - name: Test and build portable packages
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          INTERNAL: ${{ steps.plan.outputs.internal }}
          TARGETS: ${{ steps.plan.outputs.targets }}
        run: |
          set -euo pipefail
          args=(--version "$VERSION" --targets "$TARGETS")
          if [[ "$INTERNAL" == true ]]; then args+=(--internal); fi
          bash scripts/release.sh "${args[@]}"
          (cd "dist/$VERSION" && sha256sum -c SHA256SUMS)
      - name: Record CI build scope
        if: success()
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          DRAFT: ${{ steps.plan.outputs.draft }}
        run: |
          {
            printf '## Anchor %s\n\n' "$VERSION"
            printf -- '- Source: `%s`\n' "$GITHUB_SHA"
            printf -- '- Build: `%s`, attempt `%s`\n' "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT"
            printf -- '- Scope: Actions artifact; draft requested: `%s`; NOT publicly released.\n' "$DRAFT"
            printf -- '- Linux: standalone and archived executable smoke passed.\n'
            printf -- '- Quick download: choose the platform-specific single-file artifact.\n'
            if [[ "$DRAFT" == true ]]; then
              printf -- '- Public candidate scope: Linux/Windows AMD64; Windows native acceptance runs in the next job; AGPL-3.0-only; vendored corresponding source included.\n'
            else
              printf -- '- Windows: cross-compile only; native acceptance pending.\n'
            fi
            printf -- '- Full metadata and SHA256: see release.json and SHA256SUMS.\n'
          } | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Upload single Linux core
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anchor-linux-amd64-${{ steps.plan.outputs.version }}
          path: dist/${{ steps.plan.outputs.version }}/anchor_${{ steps.plan.outputs.version }}_linux_amd64
          if-no-files-found: error
          retention-days: 14
      - name: Upload single Windows core
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anchor-windows-amd64-${{ steps.plan.outputs.version }}
          path: dist/${{ steps.plan.outputs.version }}/anchor_${{ steps.plan.outputs.version }}_windows_amd64.exe
          if-no-files-found: error
          retention-days: 14
      - name: Preserve complete packages or partial diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: warn
          retention-days: 14

  installer-windows:
    runs-on: windows-2025
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        powershell: [powershell.exe, pwsh]
    env:
      ANCHOR_INSTALLER_TEST_POWERSHELL: ${{ matrix.powershell }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Test installer with isolated state and offline downloads
        run: python -m unittest discover -s scripts -p "test_release_installer.py" -v

  native-windows:
    needs: build
    if: needs.build.outputs.draft == 'true'
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Native acceptance of the exact standalone and ZIP executables
        env:
          VERSION: ${{ needs.build.outputs.version }}
          PYTHONUTF8: '1'
        run: python scripts/windows_acceptance.py --directory "dist/$env:VERSION" --version "$env:VERSION" --revision "$env:GITHUB_SHA" --output windows-native.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: windows-native.json
          if-no-files-found: error
          retention-days: 14

  draft:
    needs: [build, installer-windows, native-windows]
    if: needs.build.outputs.draft == 'true' && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: anchor-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: windows-native-${{ github.run_id }}-${{ github.run_attempt }}
          path: native-evidence
      - name: Complete native acceptance gate and verify bundle against tag and source
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 scripts/ci_release.py finalize-windows --directory "dist/$VERSION" \
            --version "$VERSION" --revision "$GITHUB_SHA" \
            --evidence native-evidence/windows-native.json \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          python3 scripts/ci_release.py verify --directory "dist/$VERSION" \
            --version "$VERSION" --revision "$GITHUB_SHA"
      - name: Create draft prerelease without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          dir="dist/$VERSION"
          gh release create "$GITHUB_REF_NAME" \
            "$dir/anchor_${VERSION}_linux_amd64" \
            "$dir/anchor_${VERSION}_linux_amd64.tar.gz" \
            "$dir/anchor_${VERSION}_windows_amd64.exe" "$dir/anchor_${VERSION}_windows_amd64.zip" \
            "$dir/anchor_${VERSION}_source.tar.gz" "$dir/LICENSE" "$dir/THIRD_PARTY_NOTICES.txt" \
            "$dir/release.json" "$dir/RELEASE_NOTES.md" "$dir/SHA256SUMS" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false \
            --title "Anchor $VERSION" --notes-file "$dir/RELEASE_NOTES.md"
          printf 'Draft created for `%s`. Linux/Windows native-verified candidate; review sources, license and publication gates before publishing.\n' \
            "$GITHUB_REF_NAME" >> "$GITHUB_STEP_SUMMARY"
